<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boku Reader</title>
<style>
  /* Colours, type and cards are copied from ui/ui2.html (see docs/add-ons.md). */
  :root {
    --bg: #F6F6F4;
    --card: #FFFFFF;
    --line: #E7E6E2;
    --text: #1B1B19;
    --muted: #76756F;
    --faint: #A9A8A2;
    --accent: #1B1B19;
    --on-accent: #FFFFFF;
    --ok: #2E9E6A;
    --err: #D0463B;
    --field: #F2F1EE;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615;
      --card: #1F1F1E;
      --line: #2E2E2C;
      --text: #F1F0EC;
      --muted: #9C9B95;
      --faint: #6B6A65;
      --accent: #F1F0EC;
      --on-accent: #161615;
      --ok: #45BD85;
      --err: #EF6B60;
      --field: #2A2A28;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }
  main {
    display: flex;
    flex-direction: column;
    min-height: 100%;
    max-width: 820px;
    margin: 0 auto;
    padding: 28px 24px 18px;
  }

  /* header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
  }
  h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -.03em;
    line-height: 1.1;
  }
  .sub { margin-top: 6px; color: var(--muted); font-size: 13px; }

  button { font: inherit; cursor: pointer; }
  button.primary {
    flex: none;
    min-width: 96px;
    height: 36px;
    padding: 0 18px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: transparent;
    color: var(--text);
    font-weight: 600;
    transition: opacity .15s;
  }
  button.primary:hover:not(:disabled) { opacity: .8; }
  button.primary:disabled { opacity: .45; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }

  /* tabs */
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .tabs button {
    height: 32px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: transparent;
    color: var(--muted);
    font-weight: 600;
    transition: background .15s, color .15s;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button[aria-selected="true"] {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--on-accent);
  }

  /* toolbar */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 0 2px 10px; }
  h2 {
    margin: 0;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .bar input {
    width: 220px;
    max-width: 50%;
    height: 28px;
    padding: 0 10px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: var(--field);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    -webkit-user-select: text;
    user-select: text;
  }
  .bar input:focus { border-color: var(--line); outline: none; }
  .bar input::placeholder { color: var(--faint); }

  /* list */
  .list {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    -webkit-user-select: text;
    user-select: text;
    cursor: auto;
  }
  .empty { padding: 28px 16px; color: var(--muted); text-align: center; }

  table { width: 100%; border-collapse: collapse; }
  th {
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-align: left;
    text-transform: uppercase;
  }
  td { padding: 11px 16px; vertical-align: top; overflow-wrap: anywhere; }
  tr + tr td { border-top: 1px solid var(--line); }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .name { font-weight: 600; }
  .about { color: var(--muted); font-size: 12.5px; }

  .event { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .dot.ok { background: var(--ok); }
  .dot.on { background: var(--accent); }

  .entry { padding: 13px 16px; }
  .entry + .entry { border-top: 1px solid var(--line); }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
  .paths, pre {
    margin: 8px 0 0;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .paths div { padding-left: 1.4em; text-indent: -1.4em; }
  .paths .add { color: var(--ok); }
  .paths .del { color: var(--err); }
  .paths .more { color: var(--muted); font-family: inherit; }

  /* footer */
  .more-row { display: flex; justify-content: center; margin-top: 14px; }
  .notice { margin: 12px 2px 0; color: var(--err); font-size: 12.5px; overflow-wrap: anywhere; }
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: auto;
    padding: 22px 2px 0;
    color: var(--faint);
    font-size: 12px;
  }
  button.link { padding: 0; border: 0; background: none; color: var(--muted); }
  button.link:hover { color: var(--text); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Boku</h1>
      <div class="sub">Reader</div>
    </div>
    <button class="primary" id="refresh" disabled>Refresh</button>
  </header>

  <div class="tabs" id="tabs" role="tablist" aria-label="Sources"></div>

  <div class="bar">
    <h2 id="summary" aria-live="polite"></h2>
    <input id="filter" type="search" aria-label="Filter" hidden>
  </div>
  <div class="list" id="list" role="tabpanel"><div class="empty">Loading…</div></div>
  <div class="more-row"><button class="link" id="more" hidden>Load more</button></div>
  <p class="notice" id="notice" hidden></p>

  <footer>
    <span>Read-only · stored only on this device</span>
    <span id="last"></span>
  </footer>
</main>

<script>
const LABELS = {
  location: "Location",
  filetree: "Files",
  keystrokes: "Keystrokes",
  app_activity: "App activity",
};
const EVENTS = {
  opened: ["Opened", "ok"],
  closed: ["Closed", ""],
  activated: ["Switched to", "on"],
};
// view -> [singular, plural, filter placeholder, draw function]
const VIEWS = {
  location: ["position", "positions", "Filter coordinates", drawLocation],
  app_activity: ["event", "events", "Filter apps", drawApps],
  filetree: ["entry", "entries", "Filter paths", drawFiles],
  generic: ["record", "records", "Filter", drawGeneric],
};

const $ = (id) => document.getElementById(id);
let sources = [];
let current = null;  // selected source name
let page = null;     // {kind, total, rows} for the selected source
let ticket = 0;      // newest request; older answers are dropped

function label(name) {
  return LABELS[name] || name.replace(/_/g, " ").replace(/^./, (c) => c.toUpperCase());
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

// Timestamps arrive in UTC; they are shown in local time.
function when(iso) {
  const then = new Date(iso);
  if (!iso || isNaN(then)) return iso || "Unknown time";
  const time = then.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});
  if (then.toDateString() === new Date().toDateString()) return "Today, " + time;
  return then.toLocaleDateString([], {month: "short", day: "numeric"}) + ", " + time;
}

function count(n, one, many) {
  return n.toLocaleString() + " " + (n === 1 ? one : many);
}

function table(headings, rows, cells) {
  const t = el("table");
  const head = t.createTHead().insertRow();
  for (const h of headings) {
    const th = el("th", "", h);
    th.scope = "col";
    head.appendChild(th);
  }
  const body = t.createTBody();
  for (const row of rows) {
    const tr = body.insertRow();
    for (const cell of cells(row)) tr.insertCell().append(cell);
  }
  return t;
}

function drawLocation(rows) {
  return table(["Time", "Position", "Accuracy", "Altitude"], rows, (r) => {
    const time = el("div");
    time.append(el("div", "time", r.until ? when(r.time) + " – " + when(r.until) : when(r.time)));
    if (r.count > 1) time.append(el("div", "about", r.count + " readings here"));
    const metres = (v, sign) => el("span", "num", typeof v === "number" ? sign + Math.round(v) + " m" : "–");
    return [
      time,
      el("span", "num name", r.spot[0].toFixed(4) + ", " + r.spot[1].toFixed(4)),
      metres(r.accuracy, "±"),
      metres(r.altitude, ""),
    ];
  });
}

function drawApps(rows) {
  return table(["Time", "App", "Event"], rows, (r) => {
    const app = el("div");
    app.append(el("div", "name", r.name || "Unknown app"), el("div", "about", r.id));
    const [text, dot] = EVENTS[r.event] || [r.event, ""];
    const event = el("div", "event");
    event.append(el("span", "dot " + dot), el("span", "", text));
    return [el("span", "time", when(r.time)), app, event];
  });
}

function pathList(entry, paths, total, cls, sign) {
  if (!total) return;
  const box = el("div", "paths");
  for (const p of paths) box.append(el("div", cls, sign + p));
  if (total > paths.length) {
    box.append(el("div", "more", "and " + (total - paths.length).toLocaleString() + " more · filter to narrow down"));
  }
  entry.append(box);
}

function drawFiles(rows) {
  const frag = document.createDocumentFragment();
  for (const r of rows) {
    const entry = el("div", "entry");
    const head = el("div", "row");
    let title;
    if (r.snapshot) {
      title = "Snapshot · " + count(r.total, "path", "paths");
      if (r.matched) title += " · " + r.matched.toLocaleString() + " matching";
    } else {
      const parts = [];
      if (r.added_total) parts.push(r.added_total.toLocaleString() + " added");
      if (r.removed_total) parts.push(r.removed_total.toLocaleString() + " removed");
      title = parts.join(" · ");
    }
    head.append(el("span", "name", title), el("span", "time", when(r.time)));
    entry.append(head);
    if (r.root) entry.append(el("div", "about", "in " + r.root));
    if (r.snapshot) {
      pathList(entry, r.paths, r.matched, "", "");
    } else {
      pathList(entry, r.added, r.added_total, "add", "+ ");
      pathList(entry, r.removed, r.removed_total, "del", "− ");
    }
    frag.append(entry);
  }
  return frag;
}

function drawGeneric(rows) {
  const frag = document.createDocumentFragment();
  for (const r of rows) {
    const entry = el("div", "entry");
    entry.append(el("div", "time", when(r.time)), el("pre", "", r.text + (r.cut ? "\n…" : "")));
    frag.append(entry);
  }
  return frag;
}

function render() {
  const tabs = $("tabs");
  tabs.replaceChildren();
  for (const source of sources) {
    const tab = el("button", "", label(source.name));
    tab.setAttribute("role", "tab");
    tab.setAttribute("aria-selected", String(source.name === current));
    tab.addEventListener("click", () => select(source.name));
    tabs.append(tab);
  }

  const list = $("list");
  const source = sources.find((s) => s.name === current);
  const filtering = $("filter").value.trim() !== "";
  $("filter").hidden = !source;
  $("last").textContent = source && source.last ? "Last recorded " + when(source.last) : "";
  $("more").hidden = !(page && page.rows.length < page.total);

  if (!source) {
    $("summary").textContent = "";
    list.replaceChildren(el("div", "empty", "No data yet. Start Boku and turn on a source."));
    return;
  }
  if (!page) return;
  const [one, many, placeholder, draw] = VIEWS[page.kind] || VIEWS.generic;
  $("filter").placeholder = placeholder;
  $("summary").textContent = count(page.total, one, many) + (filtering ? " matching" : "");
  if (page.rows.length) list.replaceChildren(draw(page.rows));
  else list.replaceChildren(el("div", "empty", filtering ? "Nothing matches." : "Nothing recorded yet."));
}

function fail(e) {
  $("notice").hidden = false;
  $("notice").textContent = String((e && e.message) || e);
}

// Fetch rows for the selected source: from the top, or the next page.
async function load(append) {
  if (!current) { page = null; render(); return; }
  const mine = ++ticket;
  const offset = append && page ? page.rows.length : 0;
  try {
    const result = await window.pywebview.api.rows(current, $("filter").value, offset);
    if (mine !== ticket) return;
    $("notice").hidden = true;
    if (result.error) fail(result.error);
    if (append && page) result.rows = page.rows.concat(result.rows);
    page = result;
  } catch (e) {
    if (mine !== ticket) return;
    fail(e);
  }
  render();
}

function select(name) {
  if (name === current) return;
  current = name;
  page = null;
  $("filter").value = "";
  $("list").replaceChildren(el("div", "empty", "Loading…"));
  render();
  load(false);
}

async function refresh() {
  $("refresh").disabled = true;
  try {
    sources = await window.pywebview.api.sources();
    if (!sources.some((s) => s.name === current)) current = sources.length ? sources[0].name : null;
    await load(false);
  } catch (e) {
    fail(e);
  }
  $("refresh").disabled = false;
}

let typing = null;
$("filter").addEventListener("input", () => {
  clearTimeout(typing);
  typing = setTimeout(() => load(false), 200);
});
$("more").addEventListener("click", () => load(true));
$("refresh").addEventListener("click", refresh);

let started = false;
function boot() {
  if (started || !window.pywebview || !window.pywebview.api || !window.pywebview.api.sources) return;
  started = true;
  refresh();
}
window.addEventListener("pywebviewready", boot);
boot();
</script>
</body>
</html>
